<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fff7f9">
    <title>A tiny question for you</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: #49283e;
        background: #fff7f9;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 10% 12%, #ffe1eb 0, transparent 34%),
          radial-gradient(ellipse at 90% 86%, #e9e1ff 0, transparent 36%),
          #fff7f9;
      }

      .heart {
        position: fixed;
        color: #f3b4cb;
        opacity: .7;
        user-select: none;
        pointer-events: none;
      }

      .heart-one {
        top: 12%;
        left: 12%;
        font-size: 2rem;
        transform: rotate(-15deg);
      }

      .heart-two {
        right: 13%;
        bottom: 14%;
        font-size: 2.8rem;
        transform: rotate(12deg);
      }

      .heart-three {
        top: 18%;
        right: 20%;
        font-size: 1.2rem;
      }

      main {
        width: min(92vw, 560px);
        padding: 48px 32px 32px;
        border: 1px solid #f8e1e9;
        border-radius: 28px;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 24px 70px rgb(131 70 101 / 12%);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #ba6f91;
        font-size: .78rem;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 7vw, 3.2rem);
        font-weight: 600;
        letter-spacing: -.04em;
        line-height: 1.12;
      }

      .subtitle {
        margin: 16px 0 0;
        color: #8d7183;
        font-size: 1rem;
      }

      .play-area {
        position: relative;
        width: 100%;
        height: 180px;
        margin-top: 20px;
      }

      button {
        position: absolute;
        top: 50%;
        min-width: 112px;
        padding: 14px 24px;
        border: 0;
        border-radius: 999px;
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transform: translate(-50%, -50%);
        transition: left 180ms ease, top 180ms ease, box-shadow 180ms ease, background 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      button:focus-visible {
        outline: 3px solid #d59ab3;
        outline-offset: 4px;
      }

      #yes-button {
        left: 35%;
        color: white;
        background: #e77fa3;
        box-shadow: 0 8px 18px rgb(231 127 163 / 30%);
      }

      #yes-button:hover {
        background: #dd6d95;
      }

      #no-button {
        left: 65%;
        color: #76566a;
        background: #f8edf2;
      }

      #no-button:hover {
        background: #f2e1e9;
      }

      .message {
        min-height: 1.5em;
        margin: 4px 0 0;
        color: #a45b7e;
        font-size: .95rem;
        font-weight: 600;
      }

      @media (max-width: 420px) {
        main {
          padding: 40px 20px 24px;
        }

        .play-area {
          height: 160px;
        }

        button {
          min-width: 100px;
          padding: 13px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <span class="heart heart-one" aria-hidden="true">♥</span>
    <span class="heart heart-two" aria-hidden="true">♥</span>
    <span class="heart heart-three" aria-hidden="true">♥</span>

    <main>
      <p class="eyebrow">A very important question</p>
      <h1>Will you be my favorite person, potti?</h1>
      <p class="subtitle">Choose wisely... one of these buttons is a little shy.</p>

      <div class="play-area" id="play-area">
        <button id="yes-button" type="button">Yes! 💖</button>
        <button id="no-button" type="button">No</button>
      </div>
      <p class="message" id="message" aria-live="polite"></p>
    </main>

    <script>
      const playArea = document.querySelector("#play-area");
      const yesButton = document.querySelector("#yes-button");
      const noButton = document.querySelector("#no-button");
      const message = document.querySelector("#message");
      const noMessages = [
        "Hmm... want to think about that one more time? 🥺",
        "I'll just keep being adorable over here. 💕",
        "That 'No' seems a little suspicious... 😄",
        "Okay, but you're still my favorite. 💗"
      ];
      let noMessageIndex = 0;

      function moveYesButton() {
        const area = playArea.getBoundingClientRect();
        const button = yesButton.getBoundingClientRect();
        const padding = 8;
        const halfWidth = button.width / 2;
        const halfHeight = button.height / 2;
        const minX = halfWidth + padding;
        const maxX = area.width - halfWidth - padding;
        const minY = halfHeight + padding;
        const maxY = area.height - halfHeight - padding;
        const currentX = parseFloat(yesButton.style.left) || area.width * 0.35;
        const currentY = parseFloat(yesButton.style.top) || area.height * 0.5;
        let nextX = currentX;
        let nextY = currentY;

        for (let attempt = 0; attempt < 12; attempt++) {
          nextX = minX + Math.random() * Math.max(0, maxX - minX);
          nextY = minY + Math.random() * Math.max(0, maxY - minY);
          if (Math.hypot(nextX - currentX, nextY - currentY) > 90) break;
        }

        yesButton.style.left = `${nextX}px`;
        yesButton.style.top = `${nextY}px`;
      }

      yesButton.addEventListener("pointerenter", moveYesButton);
      yesButton.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") moveYesButton();
      });
      yesButton.addEventListener("click", () => {
        message.textContent = "Yay! You caught it — I knew you'd say yes! 💞";
      });

      noButton.addEventListener("click", () => {
        message.textContent = noMessages[noMessageIndex % noMessages.length];
        noMessageIndex++;
      });
    </script>
  </body>
</html>
